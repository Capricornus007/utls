name: "Go"

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os:
          - 'ubuntu-latest' # amd64 linux
          - 'ubuntu-24.04-arm' # arm64 linux
      fail-fast: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: 0
      # GOTOOLCHAIN 由 setup-feed-go 釘成 local：留成 go1.2x.y 會讓 go 去下載
      # 發布版頂替尖端，這一輪驗的就不是用戶機上那顆 toolchain。
    steps:
      - uses: actions/checkout@v7
      - name: Install Go from the feed (golang/go master tip)
        uses: Capricornus007/repo/.github/actions/setup-feed-go@master
      - run: go version
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -v ./...
